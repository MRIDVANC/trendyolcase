SecAuditLog /var/log/modsecurity_audit.log

# Kendi özel kurallarımızı dahil ediyoruz
Include /etc/modsecurity/custom_rules.conf
root@waf:~# cat /etc/modsecurity/custom_rules.conf

# Rule 1: Admin Dizini Koruması
SecRule REQUEST_URI "@rx ^/admin" \
    "id:200001,phase:1,deny,status:403,log,msg:'Trendyol Case: Blocked POST/DELETE to Admin',chain"
    SecRule REQUEST_METHOD "@rx ^(POST|DELETE)$"

# Rule 2: SQL Injection - Gelişmiş Koruma (OR 1=1 ve LIMIT eklendi)
SecRule ARGS "@rx (?i)('?\s*(OR|AND)\s+('?\d+'?|[\w.]+)\s*[=<>]+\s*('?\d+'?|[\w.]+)|UNION.*SELECT|SELECT.*FROM|INSERT.*INTO|LIMIT\s+\d+|--|#)" \
    "id:200002,phase:2,deny,status:403,log,msg:'Trendyol Case: Advanced SQL Injection Blocked'"

# Rule 3: XSS Koruması
SecRule ARGS "@rx <script" \
    "id:200003,phase:2,deny,status:403,log,msg:'Trendyol Case: XSS Blocked'"

# Rule 200005: OS Command Injection Prevention (Trendyol Assessment Fix)
SecRule ARGS "@rx (?i)(;|\||`|\$|&|cat\s+|ls\s+|id\s+|whoami|/etc/passwd|/bin/bash|/bin/sh)" \
    "id:200005,phase:2,deny,status:403,log,msg:'Trendyol Case: OS Command Injection Attempt Blocked'"